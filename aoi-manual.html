<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>葵庭園 婚礼サービスマニュアル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBFBF8; --ink:#1F2621; --sub:#5B6660; --pine:#2E4A3B; --pine-soft:#E6EDE8;
  --gold:#9C7B34; --line:#D9DED9; --q-bg:#FFF1C9; --q-ink:#6B5210; --warn:#9B2F2F; --warn-bg:#F8E9E7; --say-bg:#FFFFFF;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#141816; --ink:#E7ECE8; --sub:#A3AEA7; --pine:#8FB8A0; --pine-soft:#1F2A24;
  --gold:#D2B26A; --line:#2E3632; --q-bg:#3A3116; --q-ink:#EBD28E; --warn:#E59A92; --warn-bg:#3A2220; --say-bg:#1B211E;}}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 60px);scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;font-size:16px;line-height:1.85;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;font-weight:700;line-height:1.4}
.wrap{max-width:640px;margin:0 auto;padding:0 20px}
[hidden]{display:none !important}

#gate{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
#gate form{width:100%;max-width:340px;text-align:center}
#gate h1{font-size:22px;margin:0 0 6px}
#gate p{color:var(--sub);font-size:14px;margin:0 0 22px}
input[type=password],textarea,input[type=text]{width:100%;font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--say-bg);color:var(--ink)}
#gate input[type=password]{font-size:17px;text-align:center;letter-spacing:.1em}
.remember{display:flex;gap:8px;justify-content:center;align-items:center;font-size:14px;color:var(--sub);margin:14px 0}
.remember input{accent-color:var(--pine);width:18px;height:18px}
.btn{font:inherit;font-weight:700;font-size:16px;padding:12px 18px;border:0;border-radius:10px;background:var(--pine);color:var(--paper);cursor:pointer}
.btn:disabled{opacity:.5}
.btn-line{font:inherit;font-size:14px;color:var(--pine);background:none;border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer}
.err{color:var(--warn);font-size:14px;min-height:1.6em;margin:10px 0 0}
#gate .btn{width:100%}

.crest{display:block;width:44px;height:44px;margin:0 auto 18px;color:var(--pine)}
header.hero{padding:34px 0 24px;border-bottom:1px solid var(--line)}
header.hero .crest{margin:0 0 14px}
header.hero h1{font-size:27px;margin:0 0 8px;letter-spacing:.03em}
header.hero p{margin:0;color:var(--sub);font-size:14px}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--paper);border-bottom:1px solid var(--line)}
nav.tabs .scroller{display:flex;gap:6px;overflow-x:auto;padding:10px 20px;max-width:640px;margin:0 auto;scrollbar-width:none}
nav.tabs .scroller::-webkit-scrollbar{display:none}
nav.tabs a{flex:0 0 auto;text-decoration:none;color:var(--pine);font-size:14px;font-weight:500;padding:6px 14px;border:1px solid var(--line);border-radius:999px;white-space:nowrap}

section{padding:34px 0 8px}
section h2{font-size:23px;margin:0 0 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
section h2 .edit{flex:0 0 auto}
h3{font-size:17px;margin:24px 0 8px;color:var(--pine);font-family:"Zen Kaku Gothic New",sans-serif}
ul,ol{padding-left:1.3em;margin:8px 0}
li{margin:5px 0}
ol.steps{list-style:none;counter-reset:s;padding:0}
ol.steps li{counter-increment:s;position:relative;padding-left:34px;margin:10px 0}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:2px;width:23px;height:23px;border-radius:50%;
  border:1.5px solid var(--pine);color:var(--pine);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1}
.q{display:inline-block;background:var(--q-bg);color:var(--q-ink);font-size:12px;font-weight:500;padding:0 7px;border-radius:4px;margin:0 3px;line-height:1.7;vertical-align:1px}
.say{position:relative;background:var(--say-bg);border:1px solid var(--line);border-radius:12px;padding:14px 16px 14px 44px;margin:12px 0;
  font-family:"Shippori Mincho","Hiragino Mincho ProN",serif;font-size:15.5px;line-height:1.95}
.say::before{content:"話";position:absolute;left:12px;top:15px;width:22px;height:22px;border-radius:6px;background:var(--pine);color:var(--paper);
  font-family:"Zen Kaku Gothic New",sans-serif;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1}
.box{border-left:3px solid var(--pine);background:var(--pine-soft);padding:12px 16px;border-radius:0 8px 8px 0;margin:14px 0}
.box.warn{border-color:var(--warn);background:var(--warn-bg);font-weight:500}
.box p{margin:0}
.tbl{overflow-x:auto;margin:10px 0}
.grid{width:100%;border-collapse:collapse;font-size:15px}
.grid th,.grid td{border-bottom:1px solid var(--line);padding:9px 8px 9px 0;text-align:left;vertical-align:top}
.grid th{font-size:13px;color:var(--sub);font-weight:500}
.grid td:first-child{font-weight:700}
.check{list-style:none;padding:0}
.check li{margin:0;border-bottom:1px solid var(--line)}
.check label{display:flex;gap:12px;align-items:flex-start;padding:12px 0;cursor:pointer}
.check input{width:22px;height:22px;margin-top:3px;accent-color:var(--pine);flex:0 0 auto}
.check input:checked + span{color:var(--sub);text-decoration:line-through}
footer{padding:30px 0 120px;color:var(--sub);font-size:13px;border-top:1px solid var(--line);margin-top:36px}
footer .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

#bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);border-top:1px solid var(--line);
  padding:10px 20px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;justify-content:space-between}
#bar .status{font-size:12px;color:var(--sub);line-height:1.4}

#editor{position:fixed;inset:0;z-index:30;background:var(--paper);overflow-y:auto;padding-top:env(safe-area-inset-top,0px)}
#editor .wrap{padding-bottom:40px}
#editor h2{font-size:20px;margin:22px 0 4px}
#editor textarea{min-height:52vh;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;line-height:1.8}
#editor .row{display:flex;gap:10px;align-items:center;margin:14px 0}
#editor .row .btn{flex:1}
.seclist{list-style:none;padding:0;margin:8px 0 0}
.seclist li{border-bottom:1px solid var(--line)}
.seclist button{width:100%;text-align:left;font:inherit;background:none;border:0;padding:14px 4px;color:var(--ink);cursor:pointer}
.help{font-size:13.5px;color:var(--sub);background:var(--pine-soft);border-radius:10px;padding:12px 14px;margin:16px 0}
.help code{font-family:ui-monospace,Menlo,monospace;color:var(--ink)}
.hist{list-style:none;padding:0}
.hist li{border-bottom:1px solid var(--line);padding:12px 0;display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:14px}
</style>
</head>
<body>

<div id="gate">
  <form id="gateForm" autocomplete="off">
    <svg class="crest" viewBox="0 0 48 48" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6">
      <circle cx="24" cy="24" r="21"/>
      <path d="M24 24 C 16 20, 13 11, 20 6 C 25 10, 27 17, 24 24Z"/>
      <path d="M24 24 C 32 20, 38 26, 36 34 C 30 35, 25 30, 24 24Z"/>
      <path d="M24 24 C 22 32, 14 37, 9 31 C 12 26, 18 23, 24 24Z"/>
    </svg>
    <h1>婚礼サービスマニュアル</h1>
    <p>スタッフ専用です。パスワードを入力してください。</p>
    <input type="password" id="pw" aria-label="パスワード" autocapitalize="off" autocorrect="off" spellcheck="false" required>
    <label class="remember"><input type="checkbox" id="remember" checked>この端末で記憶する</label>
    <button type="submit" class="btn" id="openBtn">ひらく</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</div>

<div id="app" hidden>
  <div id="doc"></div>
  <div id="bar">
    <div class="status" id="status"></div>
    <div style="display:flex;gap:8px">
      <button class="btn-line" id="reloadBtn" type="button">更新</button>
      <button class="btn" id="editBtn" type="button" style="font-size:14px;padding:9px 16px">編集</button>
    </div>
  </div>
</div>

<div id="editor" hidden>
  <div class="wrap">
    <div id="edList">
      <h2>編集するところを選ぶ</h2>
      <p style="color:var(--sub);font-size:14px;margin:4px 0 0">保存すると、同じURLを開いた全員に反映されます。</p>
      <ul class="seclist" id="secList"></ul>
      <div class="row">
        <button class="btn-line" id="histBtn" type="button">履歴を見る</button>
        <button class="btn-line" id="closeEd" type="button">とじる</button>
      </div>
    </div>

    <div id="edForm" hidden>
      <h2 id="edTitle"></h2>
      <textarea id="edText" spellcheck="false"></textarea>
      <input type="text" id="edNote" placeholder="変更メモ（任意・例：箸の説明を追加）" style="margin-top:10px">
      <div class="row">
        <button class="btn" id="saveBtn" type="button">保存する</button>
        <button class="btn-line" id="cancelBtn" type="button">やめる</button>
      </div>
      <div class="err" id="edErr"></div>
      <div class="help">
        <b>書き方</b><br>
        <code>### 小見出し</code><br>
        <code>- 箇条書き</code>／<code>+ 番号つきの手順</code><br>
        <code>&gt; そのまま読むセリフ</code><br>
        <code>! 赤い注意</code>／<code>* 緑の補足</code><br>
        <code>[ ] チェックリスト項目</code><br>
        <code>| 左 | 右 |</code>（最初の行が見出し）<br>
        <code>{{要確認}}</code> / <code>{{要確認:中身}}</code> で黄色いラベル<br>
        そのほかの行はふつうの文章になります。
      </div>
    </div>

    <div id="edHist" hidden>
      <h2>履歴</h2>
      <ul class="hist" id="histList"></ul>
      <div class="row"><button class="btn-line" id="backHist" type="button">もどる</button></div>
    </div>
  </div>
</div>

/* ---------- storage ---------- */
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}

/* ---------- crypto ---------- */
function u8(b64){var b=atob(b64),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function b64(buf){var u=new Uint8Array(buf),s='';for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
async function keyFor(pw,salt,iter){
  var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function dec(pw,rec){
  var k=await keyFor(pw,u8(rec.salt),rec.iter||250000);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(rec.iv)},k,u8(rec.ct));
  return new TextDecoder().decode(pt);
}
async function enc(pw,text){
  var salt=crypto.getRandomValues(new Uint8Array(16)), iv=crypto.getRandomValues(new Uint8Array(12));
  var k=await keyFor(pw,salt,BASE.iter);
  var ct=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},k,new TextEncoder().encode(text));
  return {salt:b64(salt),iv:b64(iv),ct:b64(ct),iter:BASE.iter};
}

/* ---------- supabase ---------- */
function api(path,opt){
  opt=opt||{}; opt.headers=Object.assign({apikey:KEY,Authorization:'Bearer '+KEY},opt.headers||{});
  return fetch(SUPA+'/rest/v1/'+path,opt);
}
async function fetchLatest(){
  var r=await api(TBL+'?select=id,salt,iv,ct,iter,created_at,note&order=id.desc&limit=1');
  if(!r.ok) throw new Error('load');
  var rows=await r.json(); return rows[0]||null;
}
async function pushVersion(rec,note){
  var r=await api(TBL,{method:'POST',headers:{'Content-Type':'application/json',Prefer:'return=representation'},
    body:JSON.stringify([{salt:rec.salt,iv:rec.iv,ct:rec.ct,iter:rec.iter,note:note||null}])});
  if(!r.ok) throw new Error(await r.text());
  var rows=await r.json(); return rows[0];
}

/* ---------- markup ---------- */
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function inline(s){
  return esc(s).replace(/\{\{要確認(?::([^}]*))?\}\}/g,function(_,t){return '<span class="q">要確認'+(t?'：'+t:'')+'</span>'});
}
function renderBlocks(lines){
  var html='',buf=[],mode=null;
  function flush(){
    if(!mode)return;
    if(mode==='ul')html+='<ul>'+buf.map(function(t){return '<li>'+inline(t)+'</li>'}).join('')+'</ul>';
    if(mode==='ol')html+='<ol class="steps">'+buf.map(function(t){return '<li>'+inline(t)+'</li>'}).join('')+'</ol>';
    if(mode==='say')html+='<div class="say">'+buf.map(inline).join('<br>')+'</div>';
    if(mode==='check')html+='<ul class="check">'+buf.map(function(t){return '<li><label><input type="checkbox" data-k="'+esc(t)+'"><span>'+inline(t)+'</span></label></li>'}).join('')+'</ul>';
    if(mode==='tbl'){
      var rows=buf.map(function(t){return t.replace(/^\|/,'').replace(/\|$/,'').split('|').map(function(c){return c.trim()})});
      var head=rows.shift();
      html+='<div class="tbl"><table class="grid"><thead><tr>'+head.map(function(c){return '<th>'+inline(c)+'</th>'}).join('')+'</tr></thead><tbody>'
        +rows.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+inline(c)+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table></div>';
    }
    buf=[];mode=null;
  }
  function push(m,t){if(mode!==m)flush();mode=m;buf.push(t)}
  lines.forEach(function(raw){
    var l=raw.replace(/\s+$/,'');
    if(!l.trim()){flush();return}
    if(/^### /.test(l)){flush();html+='<h3>'+inline(l.slice(4))+'</h3>';return}
    if(/^- /.test(l)){push('ul',l.slice(2));return}
    if(/^\+ /.test(l)){push('ol',l.slice(2));return}
    if(/^> /.test(l)){push('say',l.slice(2));return}
    if(/^\[ ?\] /.test(l)){push('check',l.replace(/^\[ ?\] /,''));return}
    if(/^\|/.test(l)){push('tbl',l);return}
    if(/^! /.test(l)){flush();html+='<div class="box warn"><p>'+inline(l.slice(2))+'</p></div>';return}
    if(/^\* /.test(l)){flush();html+='<div class="box"><p>'+inline(l.slice(2))+'</p></div>';return}
    flush();html+='<p>'+inline(l)+'</p>';
  });
  flush();return html;
}
function splitSections(src){
  var lines=src.split('\n'), out=[], cur={title:null,label:null,lines:[]};
  lines.forEach(function(l){
    if(/^## /.test(l)){out.push(cur);var p=l.slice(3).split('|');cur={title:p[0].trim(),label:(p[1]||p[0]).trim(),lines:[]}}
    else cur.lines.push(l);
  });
  out.push(cur);return out;
}
function render(){
  SECS=splitSections(SRC);
  var head=SECS[0], title='葵庭園 婚礼サービスマニュアル', intro=[];
  head.lines.forEach(function(l){ if(/^# /.test(l)) title=l.slice(2); else if(l.trim()) intro.push(l); });
  var nav=SECS.slice(1).map(function(s,i){return '<a href="#s'+(i+1)+'">'+esc(s.label)+'</a>'}).join('');
  var body=SECS.slice(1).map(function(s,i){
    return '<section id="s'+(i+1)+'"><h2><span>'+esc(s.title)+'</span>'
      +'<button class="btn-line edit" data-i="'+(i+1)+'">編集</button></h2>'+renderBlocks(s.lines)+'</section>';
  }).join('');
  document.getElementById('doc').innerHTML=
    '<header class="hero"><div class="wrap">'
    +'<svg class="crest" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="24" cy="24" r="21"/>'
    +'<path d="M24 24 C 16 20, 13 11, 20 6 C 25 10, 27 17, 24 24Z"/><path d="M24 24 C 32 20, 38 26, 36 34 C 30 35, 25 30, 24 24Z"/>'
    +'<path d="M24 24 C 22 32, 14 37, 9 31 C 12 26, 18 23, 24 24Z"/></svg>'
    +'<h1>'+esc(title)+'</h1><p>'+intro.map(inline).join('<br>')+'</p></div></header>'
    +'<nav class="tabs"><div class="scroller">'+nav+'</div></nav>'
    +'<main class="wrap">'+body+'</main>'
    +'<footer><div class="wrap">内容は現場のルールが優先です。間違いに気づいたら、そのセクションの「編集」から直してください。'
    +'<div class="row"><button class="btn-line" id="resetChk" type="button">チェックを外す</button>'
    +'<button class="btn-line" id="lock" type="button">この端末からロック</button></div></div></footer>';
  wireChecks(); 
  [].forEach.call(document.querySelectorAll('.edit'),function(b){b.addEventListener('click',function(){openEdit(+b.dataset.i)})});
  document.getElementById('lock').addEventListener('click',function(){lsDel(PKEY);location.reload()});
}
function wireChecks(){
  var state={};try{state=JSON.parse(lsGet(CKEY)||'{}')||{}}catch(e){}
  var boxes=[].slice.call(document.querySelectorAll('#doc .check input'));
  boxes.forEach(function(b){b.checked=!!state[b.dataset.k];
    b.addEventListener('change',function(){state[b.dataset.k]=b.checked;lsSet(CKEY,JSON.stringify(state))})});
  var r=document.getElementById('resetChk');
  if(r)r.addEventListener('click',function(){lsSet(CKEY,'{}');boxes.forEach(function(b){b.checked=false})});
}

/* ---------- status ---------- */
function setStatus(t){document.getElementById('status').textContent=t}
function when(iso){if(!iso)return '';var d=new Date(iso);return (d.getMonth()+1)+'/'+d.getDate()+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}

/* ---------- load ---------- */
async function loadLatest(quiet){
  try{
    var row=await fetchLatest();
    if(row){
      var txt=await dec(PW,row);
      SRC=txt; LOADED_ID=row.id; lsSet(CACHE,JSON.stringify(row));
      render(); setStatus('最新版 '+when(row.created_at)+(row.note?'・'+row.note:''));
      return;
    }
    // DBが空 → 今の本文を最初の版として登録
    var rec=await enc(PW,SRC);
    var ins=await pushVersion(rec,'最初の版');
    LOADED_ID=ins.id; lsSet(CACHE,JSON.stringify(ins));
    setStatus('最新版 '+when(ins.created_at));
  }catch(e){
    if(!quiet) setStatus('オフラインです（この端末の内容を表示中）');
  }
}

async function openApp(pw){
  PW=pw;
  var cache=null; try{cache=JSON.parse(lsGet(CACHE)||'null')}catch(e){}
  if(cache){try{SRC=await dec(PW,cache);LOADED_ID=cache.id||null}catch(e){}}
  if(!SRC) SRC=await dec(PW,BASE);
  render();
  document.getElementById('gate').hidden=true;
  document.getElementById('app').hidden=false;
  setStatus('読み込み中…');
  loadLatest();
  if(location.hash){var t=document.querySelector(location.hash);if(t)t.scrollIntoView()}
}

function show(id){['edList','edForm','edHist'].forEach(function(x){document.getElementById(x).hidden=(x!==id)})}
function openEditor(){
  var ul=document.getElementById('secList');
  ul.innerHTML=SECS.map(function(s,i){
    return '<li><button type="button" data-i="'+i+'">'+(i===0?'タイトル・前書き':esc(s.title))+'</button></li>'}).join('');
  [].forEach.call(ul.querySelectorAll('button'),function(b){b.addEventListener('click',function(){openEdit(+b.dataset.i)})});
  document.getElementById('editor').hidden=false; show('edList'); window.scrollTo(0,0);
}
function openEdit(i){
  EDIT_INDEX=i;
  var s=SECS[i];
  document.getElementById('edTitle').textContent=(i===0?'タイトル・前書き':s.title);
  document.getElementById('edText').value=(i===0?'':'## '+s.title+(s.label!==s.title?'|'+s.label:'')+'\n')+s.lines.join('\n').replace(/\n+$/,'')+'\n';
  document.getElementById('edNote').value='';
  document.getElementById('edErr').textContent='';
  document.getElementById('editor').hidden=false; show('edForm'); window.scrollTo(0,0);
}
function rebuild(i,text){
  var parts=SECS.map(function(s,idx){
    if(idx===i) return null;
    return (idx===0?'':'## '+s.title+(s.label!==s.title?'|'+s.label:'')+'\n')+s.lines.join('\n');
  });
  parts[i]=text.replace(/\s+$/,'');
  return parts.join('\n\n').replace(/\n{3,}/g,'\n\n')+'\n';
}
async function save(){
  var btn=document.getElementById('saveBtn'), errEl=document.getElementById('edErr');
  btn.disabled=true; btn.textContent='保存中…'; errEl.textContent='';
  try{
    var latest=await fetchLatest();
    if(latest && LOADED_ID && latest.id!==LOADED_ID){
      if(!confirm('ほかの端末で更新されています。このまま保存すると、そちらの変更が新しい版に含まれません。保存しますか？')){
        btn.disabled=false;btn.textContent='保存する';return;
      }
    }
    var next=rebuild(EDIT_INDEX,document.getElementById('edText').value);
    var rec=await enc(PW,next);
    var ins=await pushVersion(rec,document.getElementById('edNote').value.trim());
    SRC=next; LOADED_ID=ins.id; lsSet(CACHE,JSON.stringify(Object.assign({id:ins.id,created_at:ins.created_at},rec)));
    render(); setStatus('最新版 '+when(ins.created_at));
    document.getElementById('editor').hidden=true;
  }catch(e){
    errEl.textContent='保存できませんでした。通信を確認してもう一度お試しください。';
  }
  btn.disabled=false; btn.textContent='保存する';
}
async function history(){
  show('edHist');
  var ul=document.getElementById('histList'); ul.innerHTML='<li>読み込み中…</li>';
  try{
    var r=await api(TBL+'?select=id,salt,iv,ct,iter,created_at,note&order=id.desc&limit=20');
    var rows=await r.json();
    ul.innerHTML='';
    rows.forEach(function(row){
      var li=document.createElement('li');
      var span=document.createElement('span');
      span.textContent=when(row.created_at)+(row.note?'　'+row.note:'')+(row.id===LOADED_ID?'　（表示中）':'');
      li.appendChild(span);
      if(row.id!==LOADED_ID){
        var b=document.createElement('button'); b.className='btn-line'; b.type='button'; b.textContent='この版に戻す';
        b.addEventListener('click',async function(){
          b.disabled=true;
          try{
            var txt=await dec(PW,row);
            var ins=await pushVersion({salt:row.salt,iv:row.iv,ct:row.ct,iter:row.iter},when(row.created_at)+'の版に戻した');
            SRC=txt; LOADED_ID=ins.id; render(); setStatus('最新版 '+when(ins.created_at));
            document.getElementById('editor').hidden=true;
          }catch(e){alert('戻せませんでした。')}
          b.disabled=false;
        });
        li.appendChild(b);
      }
      ul.appendChild(li);
    });
    if(!rows.length) ul.innerHTML='<li>まだ履歴がありません</li>';
  }catch(e){ ul.innerHTML='<li>読み込めませんでした</li>' }
}

/* ---------- wiring ---------- */
document.getElementById('gateForm').addEventListener('submit',async function(e){
  e.preventDefault();
  var err=document.getElementById('err'), btn=document.getElementById('openBtn');
  err.textContent=''; btn.disabled=true; btn.textContent='確認中…';
  var pw=document.getElementById('pw').value;
  try{
    await dec(pw,BASE);
    if(document.getElementById('remember').checked) lsSet(PKEY,pw); else lsDel(PKEY);
    await openApp(pw);
  }catch(x){
    err.textContent='パスワードが違います。もう一度入力してください。';
    btn.disabled=false; btn.textContent='ひらく';
  }
});
document.getElementById('editBtn').addEventListener('click',openEditor);
document.getElementById('reloadBtn').addEventListener('click',function(){setStatus('読み込み中…');loadLatest()});
document.getElementById('closeEd').addEventListener('click',function(){document.getElementById('editor').hidden=true});
document.getElementById('cancelBtn').addEventListener('click',function(){document.getElementById('editor').hidden=true});
document.getElementById('histBtn').addEventListener('click',history);
document.getElementById('backHist').addEventListener('click',function(){show('edList')});

var saved=lsGet(PKEY);
if(saved){dec(saved,BASE).then(function(){return openApp(saved)}).catch(function(){lsDel(PKEY)});}
else{setTimeout(function(){document.getElementById('pw').focus()},50)}
})();
</script>
