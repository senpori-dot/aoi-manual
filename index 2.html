<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>葵庭園 婚礼サービスマニュアル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBFBF8; --ink:#1F2621; --sub:#5B6660; --pine:#2E4A3B; --pine-soft:#E6EDE8;
  --gold:#9C7B34; --line:#D9DED9; --q-bg:#FFF1C9; --q-ink:#6B5210; --warn:#9B2F2F; --warn-bg:#F8E9E7; --say-bg:#FFFFFF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141816; --ink:#E7ECE8; --sub:#A3AEA7; --pine:#8FB8A0; --pine-soft:#1F2A24;
    --gold:#D2B26A; --line:#2E3632; --q-bg:#3A3116; --q-ink:#EBD28E; --warn:#E59A92; --warn-bg:#3A2220; --say-bg:#1B211E;
  }
}
:root[data-theme="dark"]{
  --paper:#141816; --ink:#E7ECE8; --sub:#A3AEA7; --pine:#8FB8A0; --pine-soft:#1F2A24;
  --gold:#D2B26A; --line:#2E3632; --q-bg:#3A3116; --q-ink:#EBD28E; --warn:#E59A92; --warn-bg:#3A2220; --say-bg:#1B211E;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 60px);scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  font-size:16px;line-height:1.85;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;font-weight:700;line-height:1.4}
.wrap{max-width:640px;margin:0 auto;padding:0 20px}

/* lock screen */
#gate{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
#gate form{width:100%;max-width:340px;text-align:center}
#gate .crest{margin:0 auto 18px}
#gate h1{font-size:22px;margin:0 0 6px}
#gate p{color:var(--sub);font-size:14px;margin:0 0 22px}
#gate input[type=password]{width:100%;font:inherit;font-size:17px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--say-bg);color:var(--ink);text-align:center;letter-spacing:.1em}
#gate input[type=password]:focus{outline:2px solid var(--pine);outline-offset:1px}
#gate .remember{display:flex;gap:8px;justify-content:center;align-items:center;font-size:14px;color:var(--sub);margin:14px 0}
#gate .remember input{accent-color:var(--pine);width:18px;height:18px}
#gate button{width:100%;font:inherit;font-weight:700;font-size:16px;padding:12px;border:0;border-radius:10px;background:var(--pine);color:var(--paper);cursor:pointer}
#gate button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#gate .err{color:var(--warn);font-size:14px;min-height:1.6em;margin:10px 0 0}
#app[hidden],#gate[hidden]{display:none}

.crest{display:block;width:44px;height:44px;margin-bottom:14px;color:var(--pine)}
header.hero{padding:36px 0 26px;border-bottom:1px solid var(--line)}
header.hero h1{font-size:27px;margin:0 0 8px;letter-spacing:.03em}
header.hero p{margin:0;color:var(--sub);font-size:14px}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--paper);border-bottom:1px solid var(--line)}
nav.tabs .scroller{display:flex;gap:6px;overflow-x:auto;padding:10px 20px;max-width:640px;margin:0 auto;scrollbar-width:none}
nav.tabs .scroller::-webkit-scrollbar{display:none}
nav.tabs a{flex:0 0 auto;text-decoration:none;color:var(--pine);font-size:14px;font-weight:500;padding:6px 14px;border:1px solid var(--line);border-radius:999px;white-space:nowrap}
nav.tabs a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

section{padding:36px 0 8px}
section h2{font-size:23px;margin:0 0 12px}
.lead{color:var(--sub);font-size:14px;margin:0 0 16px}
.sub{color:var(--sub);font-size:14px}
h3{font-size:17px;margin:26px 0 8px;color:var(--pine)}
ul,ol{padding-left:1.3em;margin:8px 0}
li{margin:5px 0}

ol.steps{list-style:none;counter-reset:s;padding:0}
ol.steps[start="4"]{counter-reset:s 3}
ol.steps li{counter-increment:s;position:relative;padding-left:34px;margin:10px 0}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:2px;width:23px;height:23px;border-radius:50%;
  border:1.5px solid var(--pine);color:var(--pine);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1}
ol.steps small{display:block;color:var(--sub);font-size:13px}

.q{display:inline-block;background:var(--q-bg);color:var(--q-ink);font-size:12px;font-weight:500;padding:0 7px;border-radius:4px;margin-left:6px;line-height:1.7;vertical-align:1px}
.q:first-child{margin-left:0}

.say{position:relative;background:var(--say-bg);border:1px solid var(--line);border-radius:12px;padding:14px 16px 14px 44px;margin:12px 0;
  font-family:"Shippori Mincho","Hiragino Mincho ProN",serif;font-size:15.5px;line-height:1.95}
.say::before{content:"話";position:absolute;left:12px;top:15px;width:22px;height:22px;border-radius:6px;background:var(--pine);color:var(--paper);
  font-family:"Zen Kaku Gothic New",sans-serif;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1}

.box{border-left:3px solid var(--pine);background:var(--pine-soft);padding:12px 16px;border-radius:0 8px 8px 0;margin:14px 0}
.box.warn{border-color:var(--warn);background:var(--warn-bg)}
.box.warn strong{color:var(--warn)}
.box p{margin:0}

details{border-bottom:1px solid var(--line)}
details:first-of-type,h3+details,p+details,.say+details{border-top:1px solid var(--line)}
summary{cursor:pointer;list-style:none;padding:13px 28px 13px 0;font-weight:500;position:relative}
summary::-webkit-details-marker{display:none}
summary::after{content:"＋";position:absolute;right:2px;top:13px;color:var(--pine)}
details[open] summary::after{content:"－"}
summary:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
details .inner{padding:0 0 16px;font-size:15px}
details .inner p{margin:6px 0}

.tbl{overflow-x:auto;margin:10px 0}
.grid{width:100%;border-collapse:collapse;font-size:15px}
.grid th,.grid td{border-bottom:1px solid var(--line);padding:9px 8px 9px 0;text-align:left;vertical-align:top}
.grid th{font-size:13px;color:var(--sub);font-weight:500}
.grid td:first-child{font-weight:700;white-space:nowrap}
.words td:first-child{color:var(--warn)}

.check{list-style:none;padding:0}
.check li{margin:0;border-bottom:1px solid var(--line)}
.check label{display:flex;gap:12px;align-items:flex-start;padding:12px 0;cursor:pointer}
.check input{width:22px;height:22px;margin-top:3px;accent-color:var(--pine);flex:0 0 auto}
.check input:checked + span{color:var(--sub);text-decoration:line-through}
.check-actions{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:14px;color:var(--sub)}
.btn-line{font:inherit;font-size:14px;color:var(--pine);background:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;margin-top:12px}
.btn-line:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
footer{padding:36px 0 48px;color:var(--sub);font-size:13px;border-top:1px solid var(--line);margin-top:36px}
</style>
</head>
<body>

<div id="gate">
  <form id="gateForm" autocomplete="off">
    <svg class="crest" viewBox="0 0 48 48" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6">
      <circle cx="24" cy="24" r="21"/>
      <path d="M24 24 C 16 20, 13 11, 20 6 C 25 10, 27 17, 24 24Z"/>
      <path d="M24 24 C 32 20, 38 26, 36 34 C 30 35, 25 30, 24 24Z"/>
      <path d="M24 24 C 22 32, 14 37, 9 31 C 12 26, 18 23, 24 24Z"/>
    </svg>
    <h1>婚礼サービスマニュアル</h1>
    <p>スタッフ専用です。パスワードを入力してください。</p>
    <label for="pw" style="position:absolute;left:-9999px">パスワード</label>
    <input type="password" id="pw" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" required>
    <label class="remember"><input type="checkbox" id="remember" checked>この端末で記憶する</label>
    <button type="submit" id="openBtn">ひらく</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</div>

<div id="app" hidden></div>

sa+zcanoXYosdIexPmsjP4Ezu9agPM5Ff/+HQze6FRzo9yY3U=",iter:250000};
  var PKEY='aoi-manual-pw', CKEY='aoi-manual-check';
  function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
  async function decrypt(pw){
    var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(DATA.salt),iterations:DATA.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(DATA.iv)},key,b64(DATA.ct));
    return new TextDecoder().decode(pt);
  }
  function get(k){try{return localStorage.getItem(k)}catch(e){return null}}
  function set(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  function del(k){try{localStorage.removeItem(k)}catch(e){}}

  function show(html){
    var app=document.getElementById('app');
    app.innerHTML=html; app.hidden=false;
    document.getElementById('gate').hidden=true;
    var boxes=[].slice.call(app.querySelectorAll('#checklist input'));
    var count=document.getElementById('count'); var state={};
    try{state=JSON.parse(get(CKEY)||'{}')||{}}catch(e){state={}}
    function render(){count.textContent=boxes.filter(function(b){return b.checked}).length+' / '+boxes.length}
    boxes.forEach(function(b){b.checked=!!state[b.dataset.k];b.addEventListener('change',function(){state[b.dataset.k]=b.checked;set(CKEY,JSON.stringify(state));render()})});
    document.getElementById('reset').addEventListener('click',function(){state={};boxes.forEach(function(b){b.checked=false});set(CKEY,'{}');render()});
    document.getElementById('lock').addEventListener('click',function(){del(PKEY);location.reload()});
    render();
    if(location.hash){var t=document.querySelector(location.hash);if(t)t.scrollIntoView()}
  }

  var form=document.getElementById('gateForm'), err=document.getElementById('err'), btn=document.getElementById('openBtn');
  form.addEventListener('submit',async function(e){
    e.preventDefault(); err.textContent=''; btn.disabled=true; btn.textContent='確認中…';
    var pw=document.getElementById('pw').value;
    try{
      var html=await decrypt(pw);
      if(document.getElementById('remember').checked) set(PKEY,pw); else del(PKEY);
      show(html);
    }catch(x){
      err.textContent='パスワードが違います。もう一度入力してください。';
      btn.disabled=false; btn.textContent='ひらく';
    }
  });

  var saved=get(PKEY);
  if(saved){decrypt(saved).then(show).catch(function(){del(PKEY)});}
  else {setTimeout(function(){document.getElementById('pw').focus()},50);}
})();
</script>
